name: Verify portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Generate INMSON GIFs
        run: node tools/generate-inmson-gifs.mjs
      - name: Generate site
        run: node compose.mjs
      - name: Verify generated site
        run: node verify.mjs
